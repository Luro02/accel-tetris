<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accel Tetris</title>
    <style>
      /* By default the browser adds padding and margin, this removes them */
      html,
      body {
        margin: 0;
        padding: 0;
      }
      * {
        /* Padding and borders should be in the element's box */
        box-sizing: border-box;
      }
      html {
        font-family: sans-serif;
        min-height: 100dvh;
        height: 100dvh; /* This is important! Took me days to figure out why things overflow off the screen */
        max-height: 100dvh;
        width: 100vw;

        /* TODO: Hide overflow after layout is done */
        overflow: auto;
        touch-action: none;
        border: red dashed 0.1rem;
      }
      body {
        /* The body should take up all the screen space */
        height: 100%;
        width: 100%;

        max-height: 100%;
        max-width: 100%;

        /* Make the body a flex container with columns,
           mainly for the info text and the actual game */
        display: flex;
        flex-flow: column nowrap;
        /* gap: 0.5rem; */
      }

      #info {
        padding: 0.5rem;
        text-align: center;
        font-size: 0.9rem;
        flex: 0 0 auto;
      }

      #content {
        min-height: 0;
        /*min-width: 0;
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;*/

        flex: 1 1 0;

        display: flex;
        flex-flow: column nowrap;
        align-items: center;
        justify-content: center;

        padding: 0.5rem;
        gap: 0.5rem;

        max-height: 100%;
        max-width: 100%;
      }

      #board {
        flex: 5 1 0; /* Grow to fill remaining space */
        border-radius: 0.4rem;
        min-height: 1vmin;
      }

      #side-bar {
        display: flex;
        flex-direction: row;
        justify-content: space-around;
        align-items: center;
        width: 100%;
        height: 100%;
        max-height: 100%;
        max-width: 100%;
        min-height: 1vmin;
        border-radius: 0.4rem;

        flex: 1 1 0;
      }

      .side-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-weight: bold;
        font-size: 0.8rem;

        flex: 1 1 0;

        /* Without this the #preview will overflow the side-item */
        max-width: 100%;
        max-height: 100%;

        justify-content: center;
      }

      .side-item-text {
        flex: 0 0 auto;
      }

      /* By default canvas refuse to scale with their parents, this fixes that */
      canvas {
        /* Allow scaling below defined size */
        min-width: 0;
        min-height: 0;

        /* It can scale up to the parent container size */
        max-height: 100%;
        max-width: 100%;

        /* Make container use up the available space */
        width: 100%;
        height: 100%;

        /* The object-fit enforces the aspect ratio */
        object-fit: contain;
      }

      #score-value {
        text-align: center;
        font-size: 1.5rem;
        max-width: 100%;
        max-height: 100%;
        width: 100%;
        height: 100%;

        flex: 1 1 auto;
      }

      #preview {
        /* Otherwise it might disappear sometimes */
        min-width: 1vmin;
        min-height: 1vmin;

        flex: 1 1 auto;
      }

      /* If there is enough width, the score/preview should be on the left of the board */
      @media (min-width: 768px) {
        #content {
          flex-direction: row;
          align-items: stretch;
        }

        /* TODO: Upstream to mobile layout if these help there? */
        #score-value {
          display: flex;
          align-items: center;
          justify-content: center;
          flex: 1 1 auto;
        }

        #side-bar {
          flex-direction: column;
          width: 150px;
          height: 100%;
          justify-content: flex-start;
          gap: 2rem;
          padding: 10px; /* TODO: adjust as necessary */
        }
      }
    </style>
  </head>
  <body>
    <!-- The CSS styles resize the canvas to fit the screen, but the resolution is defined here -->
    <div id="info">Tilt your device to play</div>
    <div id="content">
      <div id="side-bar">
        <div class="side-item">
          <div class="side-item-text">SCORE</div>
          <span id="score-value">0</span>
        </div>
        <div class="side-item">
          <div class="side-item-text">NEXT</div>
          <canvas id="preview" width="500" height="500"></canvas>
        </div>
      </div>

      <canvas id="board" width="500" height="1000"></canvas>
    </div>
  </body>
  <script src="render.js" type="module"></script>
</html>
