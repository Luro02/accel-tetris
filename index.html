<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accel Tetris</title>
    <link rel="stylesheet" type="text/css" href="stylesheet.css" />
  </head>
  <body>
    <!-- The CSS styles resize the canvas to fit the screen, but the resolution is defined here -->
    <div id="info">Tilt your device or press ← → ↑ ↓ to play</div>
    <div id="content">
      <div id="side-bar">
        <div class="side-item">
          <div class="side-item-text">SCORE</div>
          <span id="score-value">0</span>
        </div>
        <div class="side-item">
          <div class="side-item-text">NEXT</div>
          <canvas id="preview" width="1000" height="1000"></canvas>
        </div>
      </div>

      <canvas id="board" width="1000" height="2000"></canvas>
    </div>
  </body>
  <script src="render.js" type="module"></script>
</html>
